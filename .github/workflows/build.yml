name: Compilar launcher

# Se ejecuta a mano: pestaña Actions > "Compilar launcher" > Run workflow
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma 34 y build-tools 34.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar (build debug, instalable sin firmar a mano)
        run: |
          if [ -f launcher/gradlew ]; then
            cd launcher
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No encontre gradlew en el repositorio."
            exit 1
          fi

      - name: Reunir el APK
        run: |
          mkdir -p salida
          find . -name "*.apk" -path "*outputs*" -exec cp {} salida/ \;
          ls -la salida

      - name: Publicar el APK para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: salida/*.apk
